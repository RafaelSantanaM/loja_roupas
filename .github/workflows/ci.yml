name: CI Pipeline - Loja de Roupas

# Quando esse robô vai rodar?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes:
    runs-on: ubuntu-latest # O servidor gratuito do GitHub que vai rodar o código

    steps:
    - name: 1. Pegar o código do repositório
      uses: actions/checkout@v3

    - name: 2. Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # Mude para a versão que você usa na sua máquina

    - name: 3. Instalar as dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx # Garantindo que as libs de teste estão instaladas

    - name: 4. Rodar os testes automatizados
      run: |
        pytest -v